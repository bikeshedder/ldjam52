[package]
name = "ldjam52"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Development tools, e.g. the scenario runner (see src/dev/scenario.rs).
dev = []
# Bundle the assets into the binary for self-contained release builds.
embed = ["dep:bevy_embedded_assets"]

[dependencies]
anyhow = "1.0.104"
bevy = "0.19.1"
bevy_embedded_assets = { version = "0.16", optional = true }
# Embeds the entity types with the `embed` feature and on the web, which has
# no file system (see src/data/entity_types.rs).
include_dir = "0.7"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3.0"
thiserror = "2.0.21"
# Without zstd: the maps aren't compressed and the C library doesn't build for
# the web.
tiled = { version = "0.16.0", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The save game lives in the local storage of the browser (see src/game/progress.rs).
web-sys = { version = "0.3", features = ["Window", "Storage"] }

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true

# Trades compile time for a smaller download of the web build (see `make web`)
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
