[package]
name = "ldjam52"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Development tools, e.g. the scenario runner (see src/dev/scenario.rs).
dev = []
# Bundle the assets into the binary for self-contained release builds.
embed = ["dep:bevy_embedded_assets", "dep:include_dir"]

[dependencies]
anyhow = "1.0.104"
bevy = "0.19.1"
bevy_embedded_assets = { version = "0.16", optional = true }
include_dir = { version = "0.7", optional = true }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3.0"
thiserror = "2.0.21"
tiled = "0.16.0"

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
